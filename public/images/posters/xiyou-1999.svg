<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-label="西游记 海报">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1408"/>
      <stop offset="0.55" stop-color="#100c06"/>
      <stop offset="1" stop-color="#070503"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#c9862f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#c9862f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9862f"/>
      <stop offset="1" stop-color="#ffd24d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="850" fill="url(#bg)"/>
  <rect width="600" height="850" fill="url(#glow)"/>
  <!-- golden cudgel (如意金箍棒) diagonal -->
  <g transform="rotate(35 300 320)">
    <rect x="286" y="150" width="28" height="340" rx="14" fill="#c9862f" opacity="0.85"/>
    <rect x="280" y="150" width="40" height="26" rx="8" fill="#ffd24d"/>
    <rect x="280" y="464" width="40" height="26" rx="8" fill="#ffd24d"/>
  </g>
  <!-- cloud somersault swirl -->
  <path d="M150 520 Q220 480 300 520 T450 520" stroke="#e8bd6c" stroke-width="6" fill="none" opacity="0.5"/>
  <circle cx="180" cy="230" r="6" fill="#ffd24d" opacity="0.7"/>
  <circle cx="430" cy="270" r="5" fill="#ffd24d" opacity="0.6"/>
  <rect x="10" y="30" width="22" height="34" rx="6" fill="#ffd24d" opacity="0.5"/>
  <rect x="568" y="786" width="22" height="34" rx="6" fill="#ffd24d" opacity="0.5"/>
  <text x="300" y="742" text-anchor="middle" font-family="serif" font-size="76" font-weight="bold" fill="#fff2d5" letter-spacing="16">西游记</text>
  <text x="300" y="786" text-anchor="middle" font-family="monospace" font-size="22" fill="#e8bd6c" letter-spacing="8">1999 · 央视动画</text>
  <rect x="150" y="806" width="300" height="6" rx="3" fill="url(#bar)"/>
</svg>
