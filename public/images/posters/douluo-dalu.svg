  <path d="M300 250 C250 270 250 340 300 360 C350 380 350 300 300 300 C270 300 270 340 300 340" fill="none" stroke="#7fd0c4" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <circle cx="300" cy="250" r="10" fill="#ffd24d"/>
  <circle cx="150" cy="230" r="6" fill="#7fb0e8" opacity="0.7"/>
  <circle cx="452" cy="250" r="5" fill="#ffd24d" opacity="0.7"/>
  <path d="M150 540 Q300 490 450 540" stroke="#3a6fc4" stroke-width="6" fill="none" opacity="0.5"/>
  <rect x="10" y="30" width="22" height="34" rx="6" fill="#ffd24d" opacity="0.5"/>
  <rect x="568" y="786" width="22" height="34" rx="6" fill="#ffd24d" opacity="0.5"/>
  <text x="300" y="742" text-anchor="middle" font-family="serif" font-size="70" font-weight="bold" fill="#fff2d5" letter-spacing="10">斗罗大陆</text>
  <text x="300" y="786" text-anchor="middle" font-family="monospace" font-size="22" fill="#e8bd6c" letter-spacing="6">2018 · 史莱克七怪</text>
