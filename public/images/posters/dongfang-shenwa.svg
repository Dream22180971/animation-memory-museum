<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-label="东方神娃 海报">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141024"/>
      <stop offset="0.55" stop-color="#0d0a18"/>
      <stop offset="1" stop-color="#060409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#7a5cc4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7a5cc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5cc4"/>
      <stop offset="1" stop-color="#ffd24d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="850" fill="url(#bg)"/>
  <rect width="600" height="850" fill="url(#glow)"/>
  <!-- sun (龙娃) and moon (凤娃) -->
  <circle cx="220" cy="300" r="70" fill="none" stroke="#ffcf6b" stroke-width="6" opacity="0.85"/>
  <circle cx="220" cy="300" r="40" fill="#ffcf6b" opacity="0.4"/>
  <path d="M360 240 a70 70 0 1 0 0 140 a55 55 0 1 1 0 -140 Z" fill="#cfe0ff" opacity="0.7"/>
  <!-- mending-sky five stones spark -->
  <circle cx="150" cy="470" r="7" fill="#ff7a5c" opacity="0.7"/>
  <circle cx="300" cy="500" r="7" fill="#61c7bb" opacity="0.7"/>
  <circle cx="450" cy="470" r="7" fill="#ffd24d" opacity="0.7"/>
  <rect x="10" y="30" width="22" height="34" rx="6" fill="#ffd24d" opacity="0.5"/>
  <rect x="568" y="786" width="22" height="34" rx="6" fill="#ffd24d" opacity="0.5"/>
  <text x="300" y="742" text-anchor="middle" font-family="serif" font-size="70" font-weight="bold" fill="#fff2d5" letter-spacing="12">东方神娃</text>
  <text x="300" y="786" text-anchor="middle" font-family="monospace" font-size="22" fill="#e8bd6c" letter-spacing="8">2005 · 神话寻亲</text>
  <rect x="150" y="806" width="300" height="6" rx="3" fill="url(#bar)"/>
</svg>
