<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" role="img" aria-label="刺客伍六七 海报">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a1c"/>
      <stop offset="0.55" stop-color="#0a1214"/>
      <stop offset="1" stop-color="#05090a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#3fb0a0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3fb0a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb0a0"/>
      <stop offset="1" stop-color="#ffd24d"/>
