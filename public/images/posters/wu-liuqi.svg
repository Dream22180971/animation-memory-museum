  <circle cx="240" cy="410" r="22" fill="none" stroke="#3fb0a0" stroke-width="8"/>
  <circle cx="360" cy="410" r="22" fill="none" stroke="#3fb0a0" stroke-width="8"/>
  <circle cx="300" cy="310" r="8" fill="#ffd24d"/>
  <!-- sparkles -->
  <circle cx="150" cy="250" r="6" fill="#ffd24d" opacity="0.7"/>
  <circle cx="450" cy="270" r="5" fill="#3fb0a0" opacity="0.7"/>
  <path d="M150 540 Q300 490 450 540" stroke="#3fb0a0" stroke-width="6" fill="none" opacity="0.5"/>
  <rect x="10" y="30" width="22" height="34" rx="6" fill="#ffd24d" opacity="0.5"/>
  <rect x="568" y="786" width="22" height="34" rx="6" fill="#ffd24d" opacity="0.5"/>
  <text x="300" y="742" text-anchor="middle" font-family="sans-serif" font-size="70" font-weight="bold" fill="#fff2d5" letter-spacing="8">伍六七</text>
  <text x="300" y="786" text-anchor="middle" font-family="monospace" font-size="22" fill="#e8bd6c" letter-spacing="6">2018 · 剪刀刺客</text>
